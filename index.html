<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Top Tracks Canvas Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
        }
        .spotify-green {
            color: #1DB954;
        }
        .bg-spotify-green {
            background-color: #1DB954;
        }
        .bg-spotify-green:hover {
            background-color: #1ed760;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <header class="border-b border-gray-800 bg-black/40 backdrop-blur-md sticky top-0 z-50 px-6 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <i class="fa-brands fa-spotify text-3xl spotify-green"></i>
            <span class="font-extrabold text-xl tracking-tight bg-gradient-to-r from-green-400 to-emerald-200 bg-clip-text text-transparent">
                Spotify Canvas Generator
            </span>
        </div>
        <div id="userStatus" class="text-sm font-medium text-gray-400">
            未認証（デモモード可）
        </div>
    </header>

    <main class="container mx-auto px-4 py-8 max-w-6xl flex-grow grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- 左側：設定・コントロールパネル -->
        <div class="lg:col-span-5 space-y-6">
            <div class="glass-card rounded-2xl p-6 space-y-5">
                <h2 class="text-lg font-bold flex items-center gap-2 text-white">
                    <i class="fa-solid fa-sliders text-green-400"></i> 設定パネル
                </h2>

                <!-- 1. 認証設定 -->
                <div class="space-y-3 pt-2 border-t border-gray-800">
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider">1. Spotify API 連携</label>

                    <div class="space-y-2">
                        <input type="text" id="clientIdInput" placeholder="Spotify Client ID を入力" 
                            class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-green-500 transition">
                        
                        <!-- Redirect URI 表示 & コピーエリア -->
                        <div class="bg-gray-900/80 border border-gray-800 rounded-lg p-2.5 text-xs space-y-2">
                            <div class="flex items-center justify-between text-gray-400 font-semibold">
                                <span>Spotify Dashboard 登録用 URI:</span>
                                <button onclick="copyRedirectUri()" id="copyUriBtn" class="text-xs text-green-400 hover:text-green-300 flex items-center gap-1 bg-green-500/10 px-2 py-0.5 rounded transition">
                                    <i class="fa-regular fa-copy"></i> コピー
                                </button>
                            </div>
                            <input type="text" id="currentRedirectUri" readonly class="w-full bg-black/50 border border-gray-800 rounded px-2 py-1 text-gray-300 text-xs font-mono select-all focus:outline-none">
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <button id="loginBtn" onclick="handleSpotifyLogin()" 
                            class="flex-1 bg-spotify-green text-black font-bold text-sm py-2.5 px-4 rounded-lg flex items-center justify-center gap-2 shadow-lg shadow-green-900/20 transition">
                            <i class="fa-brands fa-spotify"></i> Spotifyでログイン
                        </button>
                        <button onclick="loadDemoData()" 
                            class="bg-gray-800 hover:bg-gray-700 text-gray-200 font-semibold text-sm py-2.5 px-4 rounded-lg transition">
                            デモデータ
                        </button>
                    </div>
                </div>

                <!-- 2. 表示オプション -->
                <div class="space-y-4 pt-4 border-t border-gray-800">
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider">2. ランキング表示設定</label>
                    
                    <div>
                        <label class="block text-sm text-gray-300 mb-1">表示件数</label>
                        <div class="grid grid-cols-2 gap-2">
                            <button id="limit10Btn" onclick="setLimit(10)" class="py-2 rounded-lg text-sm font-semibold bg-green-500/20 text-green-400 border border-green-500/50">
                                TOP 10
                            </button>
                            <button id="limit50Btn" onclick="setLimit(50)" class="py-2 rounded-lg text-sm font-semibold bg-gray-800 text-gray-400 border border-transparent hover:border-gray-700">
                                TOP 50
                            </button>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm text-gray-300 mb-1">対象期間</label>
                        <select id="timeRangeSelect" onchange="handleTimeRangeChange()" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-green-500">
                            <option value="long_term" selected>直近1年間〜長期 (Long Term)</option>
                            <option value="medium_term">直近6ヶ月間 (Medium Term)</option>
                            <option value="short_term">直近4週間 (Short Term)</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm text-gray-300 mb-1">テーマカラー</label>
                        <div class="flex gap-3">
                            <button onclick="setTheme('dark')" class="w-8 h-8 rounded-full bg-zinc-900 border-2 border-green-500 focus:outline-none"></button>
                            <button onclick="setTheme('purple')" class="w-8 h-8 rounded-full bg-gradient-to-br from-purple-900 to-indigo-900 border-2 border-transparent focus:outline-none"></button>
                            <button onclick="setTheme('emerald')" class="w-8 h-8 rounded-full bg-gradient-to-br from-emerald-900 to-teal-900 border-2 border-transparent focus:outline-none"></button>
                        </div>
                    </div>
                </div>

                <!-- 3. アクション -->
                <div class="pt-4 border-t border-gray-800">
                    <button onclick="downloadCanvas()" class="w-full bg-white hover:bg-gray-100 text-black font-extrabold py-3 px-4 rounded-xl flex items-center justify-center gap-2 shadow-xl transition">
                        <i class="fa-solid fa-download"></i> 高画質画像をダウンロード (PNG)
                    </button>
                </div>
            </div>
        </div>

        <!-- 右側：Canvas プレビュー -->
        <div class="lg:col-span-7 flex flex-col items-center justify-center">
            <div class="glass-card p-4 rounded-2xl w-full flex flex-col items-center justify-center overflow-hidden">
                <div class="mb-3 flex items-center justify-between w-full px-2">
                    <span class="text-xs font-semibold text-gray-400">リアルタイム Canvas プレビュー</span>
                    <span id="canvasDimensions" class="text-xs text-gray-500">800 x 1200 px</span>
                </div>
                
                <div class="relative max-w-full overflow-auto flex justify-center items-center rounded-xl bg-black/50 p-2 border border-gray-800">
                    <canvas id="rankingCanvas" width="800" height="1200" class="max-w-full h-auto rounded-lg shadow-2xl"></canvas>
                </div>
            </div>
        </div>
    </main>

    <footer class="border-t border-gray-800 py-4 text-center text-xs text-gray-500">
        <p>Spotify API & HTML5 Canvas Ranking Generator</p>
    </footer>

    <script>
        // デモ用トラックデータ
        const DEMO_TRACKS = [
            { name: "Blinding Lights", artist: "The Weeknd", albumArt: "https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=300&auto=format&fit=crop" },
            { name: "Stay", artist: "The Kid LAROI, Justin Bieber", albumArt: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=300&auto=format&fit=crop" },
            { name: "As It Was", artist: "Harry Styles", albumArt: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=300&auto=format&fit=crop" },
            { name: "Starboy", artist: "The Weeknd, Daft Punk", albumArt: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=300&auto=format&fit=crop" },
            { name: "Heat Waves", artist: "Glass Animals", albumArt: "https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=300&auto=format&fit=crop" }
        ];

        let state = {
            accessToken: null,
            limit: 10,
            timeRange: 'long_term',
            theme: 'dark',
            tracks: []
        };

        window.onload = async function() {
            setupRedirectUriInfo();
            
            const savedClientId = localStorage.getItem('spotify_client_id');
            if (savedClientId) {
                document.getElementById('clientIdInput').value = savedClientId;
            }

            await checkAuthCallback();
            if (!state.accessToken) {
                loadDemoData();
            }
        };

        function setupRedirectUriInfo() {
            let redirectUri = window.location.origin + window.location.pathname;
            if (window.location.hostname === 'localhost') {
                redirectUri = redirectUri.replace('localhost', '127.0.0.1');
            }
            redirectUri = redirectUri.replace(/\/index\.html$/, '/');
            redirectUri = redirectUri.split('?')[0].split('#')[0];
            if (!redirectUri.endsWith('/')) {
                redirectUri += '/';
            }

            const uriInput = document.getElementById('currentRedirectUri');
            if (uriInput) uriInput.value = redirectUri;
        }

        function copyRedirectUri() {
            const uriInput = document.getElementById('currentRedirectUri');
            if (!uriInput) return;
            
            uriInput.select();
            uriInput.setSelectionRange(0, 99999);
            document.execCommand('copy');

            const btn = document.getElementById('copyUriBtn');
            if (btn) {
                btn.innerHTML = '<i class="fa-solid fa-check"></i> コピー完了!';
                setTimeout(() => { btn.innerHTML = '<i class="fa-regular fa-copy"></i> コピー'; }, 2000);
            }
        }

        function generateRandomString(length) {
            const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            const values = crypto.getRandomValues(new Uint8Array(length));
            return values.reduce((acc, x) => acc + possible[x % possible.length], "");
        }

        async function sha256(plain) {
            const encoder = new TextEncoder();
            const data = encoder.encode(plain);
            return window.crypto.subtle.digest('SHA-256', data);
        }

        function base64encode(input) {
            return btoa(String.fromCharCode.apply(null, new Uint8Array(input)))
                .replace(/=/g, '')
                .replace(/\+/g, '-')
                .replace(/\//g, '_');
        }

        async function handleSpotifyLogin() {
            let clientId = document.getElementById('clientIdInput').value.trim();
            if (!clientId) {
                alert("Spotify Client ID を入力してください。");
                return;
            }

            // 英数字以外の余計な文字（スペースなど）を除去
            clientId = clientId.replace(/[^a-zA-Z0-9]/g, '');

            let redirectUri = document.getElementById('currentRedirectUri').value.trim();

            const codeVerifier = generateRandomString(64);
            const hashed = await sha256(codeVerifier);
            const codeChallenge = base64encode(hashed);

            localStorage.setItem('spotify_code_verifier', codeVerifier);
            localStorage.setItem('spotify_client_id', clientId);

            const scope = 'user-top-read';

            // クエリパラメータを確実に構造化（response_type=code が100%渡るように固定）
            const params = new URLSearchParams();
            params.append('response_type', 'code');
            params.append('client_id', clientId);
            params.append('scope', scope);
            params.append('code_challenge_method', 'S256');
            params.append('code_challenge', codeChallenge);
            params.append('redirect_uri', redirectUri);

            const authUrl = `https://accounts.spotify.com/authorize?${params.toString()}`;
            window.location.href = authUrl;
        }

        async function checkAuthCallback() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');

            if (code) {
                const codeVerifier = localStorage.getItem('spotify_code_verifier');
                const clientId = localStorage.getItem('spotify_client_id') || document.getElementById('clientIdInput').value.trim();
                const redirectUri = document.getElementById('currentRedirectUri').value.trim();

                if (codeVerifier && clientId) {
                    try {
                        const response = await fetch('https://accounts.spotify.com/api/token', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/x-www-form-urlencoded',
                            },
                            body: new URLSearchParams({
                                client_id: clientId,
                                grant_type: 'authorization_code',
                                code: code,
                                redirect_uri: redirectUri,
                                code_verifier: codeVerifier
                            })
                        });

                        const data = await response.json();
                        if (data.access_token) {
                            state.accessToken = data.access_token;
                            document.getElementById('userStatus').innerHTML = '<span class="text-green-400 font-bold"><i class="fa-solid fa-circle-check"></i> Spotify 連携済み</span>';
                            window.history.replaceState({}, document.title, window.location.pathname);
                            await fetchTopTracks();
                        } else {
                            console.error('トークン取得エラー:', data);
                        }
                    } catch (err) {
                        console.error('認証エラー:', err);
                    }
                }
            }
        }

        async function fetchTopTracks() {
            if (!state.accessToken) return;

            try {
                const response = await fetch(`https://api.spotify.com/v1/me/top/tracks?time_range=${state.timeRange}&limit=50`, {
                    headers: { 'Authorization': `Bearer ${state.accessToken}` }
                });

                if (!response.ok) {
                    throw new Error('API呼び出しに失敗しました');
                }

                const data = await response.json();
                state.tracks = data.items.map(item => ({
                    name: item.name,
                    artist: item.artists.map(a => a.name).join(', '),
                    albumArt: item.album.images[0]?.url || 'https://via.placeholder.com/300'
                }));

                renderCanvas();
            } catch (err) {
                console.error(err);
                alert("Spotifyデータの取得に失敗しました。");
                loadDemoData();
            }
        }

        function loadDemoData() {
            let list = [];
            for (let i = 0; i < 50; i++) {
                const base = DEMO_TRACKS[i % DEMO_TRACKS.length];
                list.push({
                    name: `${base.name} ${i >= 10 ? '#' + (i + 1) : ''}`,
                    artist: base.artist,
                    albumArt: base.albumArt
                });
            }
            state.tracks = list;
            renderCanvas();
        }

        function setLimit(limit) {
            state.limit = limit;
            document.getElementById('limit10Btn').className = limit === 10 
                ? 'py-2 rounded-lg text-sm font-semibold bg-green-500/20 text-green-400 border border-green-500/50'
                : 'py-2 rounded-lg text-sm font-semibold bg-gray-800 text-gray-400 border border-transparent hover:border-gray-700';
            
            document.getElementById('limit50Btn').className = limit === 50 
                ? 'py-2 rounded-lg text-sm font-semibold bg-green-500/20 text-green-400 border border-green-500/50'
                : 'py-2 rounded-lg text-sm font-semibold bg-gray-800 text-gray-400 border border-transparent hover:border-gray-700';

            renderCanvas();
        }

        function handleTimeRangeChange() {
            state.timeRange = document.getElementById('timeRangeSelect').value;
            if (state.accessToken) {
                fetchTopTracks();
            } else {
                renderCanvas();
            }
        }

        function setTheme(theme) {
            state.theme = theme;
            renderCanvas();
        }

        async function renderCanvas() {
            const canvas = document.getElementById('rankingCanvas');
            const ctx = canvas.getContext('2d');

            if (state.limit === 10) {
                canvas.width = 800;
                canvas.height = 1200;
            } else {
                canvas.width = 1200;
                canvas.height = 1600;
            }
            
            document.getElementById('canvasDimensions').innerText = `${canvas.width} x ${canvas.height} px`;

            drawBackground(ctx, canvas.width, canvas.height);
            drawHeader(ctx, canvas.width);

            const displayTracks = state.tracks.slice(0, state.limit);
            
            if (state.limit === 10) {
                await drawTop10Layout(ctx, displayTracks, canvas.width);
            } else {
                await drawTop50Layout(ctx, displayTracks, canvas.width);
            }

            drawFooter(ctx, canvas.width, canvas.height);
        }

        function drawBackground(ctx, width, height) {
            let grad = ctx.createLinearGradient(0, 0, width, height);
            if (state.theme === 'dark') {
                grad.addColorStop(0, '#121212');
                grad.addColorStop(0.5, '#000000');
                grad.addColorStop(1, '#051f0e');
            } else if (state.theme === 'purple') {
                grad.addColorStop(0, '#1a0b2e');
                grad.addColorStop(0.5, '#11071f');
                grad.addColorStop(1, '#090014');
            } else if (state.theme === 'emerald') {
                grad.addColorStop(0, '#022c22');
                grad.addColorStop(0.5, '#064e3b');
                grad.addColorStop(1, '#021812');
            }

            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);
        }

        function drawHeader(ctx, width) {
            ctx.textAlign = 'left';
            
            ctx.fillStyle = '#1DB954';
            ctx.beginPath();
            ctx.arc(60, 70, 18, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#FFFFFF';
            ctx.font = 'bold 36px "Plus Jakarta Sans", sans-serif';
            ctx.fillText('MY TOP TRACKS', 95, 82);

            const rangeText = state.timeRange === 'long_term' ? 'Past 1 Year / All Time' : 
                             state.timeRange === 'medium_term' ? 'Past 6 Months' : 'Past 4 Weeks';
            
            ctx.fillStyle = '#9CA3AF';
            ctx.font = '600 18px "Plus Jakarta Sans", sans-serif';
            ctx.fillText(`RANKING TOP ${state.limit} • ${rangeText}`, 95, 110);
        }

        async function drawTop10Layout(ctx, tracks, width) {
            const startY = 150;
            const rowHeight = 95;

            for (let i = 0; i < tracks.length; i++) {
                const track = tracks[i];
                const y = startY + (i * rowHeight);

                ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
                ctx.roundRect(50, y, width - 100, 80, 12);
                ctx.fill();

                ctx.fillStyle = i < 3 ? '#1DB954' : '#6B7280';
                ctx.font = 'extrabold 28px "Plus Jakarta Sans", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(`#${i + 1}`, 90, y + 50);

                try {
                    const img = await loadImage(track.albumArt);
                    ctx.save();
                    ctx.beginPath();
                    ctx.roundRect(130, y + 10, 60, 60, 8);
                    ctx.clip();
                    ctx.drawImage(img, 130, y + 10, 60, 60);
                    ctx.restore();
                } catch (e) {
                    ctx.fillStyle = '#374151';
                    ctx.fillRect(130, y + 10, 60, 60);
                }

                ctx.textAlign = 'left';
                ctx.fillStyle = '#FFFFFF';
                ctx.font = 'bold 20px "Plus Jakarta Sans", sans-serif';
                ctx.fillText(truncateText(ctx, track.name, width - 320), 210, y + 40);

                ctx.fillStyle = '#9CA3AF';
                ctx.font = '500 15px "Plus Jakarta Sans", sans-serif';
                ctx.fillText(truncateText(ctx, track.artist, width - 320), 210, y + 63);
            }
        }

        async function drawTop50Layout(ctx, tracks, width) {
            const startY = 150;
            const cols = 2;
            const colWidth = (width - 130) / cols;
            const rowHeight = 52;

            for (let i = 0; i < tracks.length; i++) {
                const track = tracks[i];
                const col = i % cols;
                const row = Math.floor(i / cols);

                const x = 50 + (col * (colWidth + 30));
                const y = startY + (row * rowHeight);

                ctx.fillStyle = i < 3 ? '#1DB954' : '#6B7280';
                ctx.font = 'bold 16px "Plus Jakarta Sans", sans-serif';
                ctx.textAlign = 'right';
                ctx.fillText(`${i + 1}`, x + 25, y + 32);

                try {
                    const img = await loadImage(track.albumArt);
                    ctx.save();
                    ctx.beginPath();
                    ctx.roundRect(x + 35, y + 8, 36, 36, 6);
                    ctx.clip();
                    ctx.drawImage(img, x + 35, y + 8, 36, 36);
                    ctx.restore();
                } catch (e) {
                    ctx.fillStyle = '#374151';
                    ctx.fillRect(x + 35, y + 8, 36, 36);
                }

                ctx.textAlign = 'left';
                ctx.fillStyle = '#FFFFFF';
                ctx.font = 'bold 14px "Plus Jakarta Sans", sans-serif';
                ctx.fillText(truncateText(ctx, track.name, colWidth - 90), x + 80, y + 26);

                ctx.fillStyle = '#9CA3AF';
                ctx.font = '500 12px "Plus Jakarta Sans", sans-serif';
                ctx.fillText(truncateText(ctx, track.artist, colWidth - 90), x + 80, y + 41);
            }
        }

        function drawFooter(ctx, width, height) {
            ctx.textAlign = 'center';
            ctx.fillStyle = '#4B5563';
            ctx.font = '600 14px "Plus Jakarta Sans", sans-serif';
            ctx.fillText('POWERED BY SPOTIFY API • CANVAS GENERATOR', width / 2, height - 30);
        }

        function loadImage(src) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.crossOrigin = 'Anonymous';
                img.onload = () => resolve(img);
                img.onerror = (e) => reject(e);
                img.src = src;
            });
        }

        function truncateText(ctx, text, maxWidth) {
            if (ctx.measureText(text).width <= maxWidth) return text;
            let truncated = text;
            while (ctx.measureText(truncated + '...').width > maxWidth && truncated.length > 0) {
                truncated = truncated.slice(0, -1);
            }
            return truncated + '...';
        }

        function downloadCanvas() {
            const canvas = document.getElementById('rankingCanvas');
            const link = document.createElement('a');
            link.download = `spotify-top-${state.limit}-ranking.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
