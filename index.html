
<!DOCTYPE html>
<html lang="ja">
<head>

                            </div>

                        </div>

                    <div class="flex gap-2">
                        <button id="loginBtn" onclick="handleSpotifyLogin()"

                <div class="space-y-4 pt-4 border-t border-gray-800">
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider">2. ランキング表示設定</label>
                    
                    <div>
                        <label class="block text-sm text-gray-300 mb-1.5">表示件数（TOP 5 / 10 / 15 / 50）</label>
                        <div class="grid grid-cols-4 gap-2">
                            <button id="limit5Btn" onclick="setLimit(5)" class="py-2 rounded-lg text-xs sm:text-sm font-semibold bg-gray-800 text-gray-400 border border-transparent hover:border-gray-700 transition">
                                TOP 5
                            </button>
                            <button id="limit10Btn" onclick="setLimit(10)" class="py-2 rounded-lg text-xs sm:text-sm font-semibold bg-green-500/20 text-green-400 border border-green-500/50 transition">
                                TOP 10

                    <div>

                    <div>

                        <!-- 18色パレットコンテナ -->
                        <div id="themePalette" class="grid grid-cols-6 gap-2.5 bg-gray-900/60 p-3 rounded-xl border border-gray-800">

                </div>

                <!-- 3. アクション -->

                    <button id="batchGenerateBtn" onclick="generateAll18Themes()" class="w-full bg-gradient-to-r from-amber-400 via-yellow-500 to-amber-600 hover:from-amber-300 hover:to-yellow-500 text-black font-extrabold py-3 px-4 rounded-xl flex items-center justify-center gap-2 shadow-lg shadow-amber-900/30 transition">

                    <!-- 一括生成プログレス表示 -->

                            <span id="batchProgressPercent" class="text-gray-300">0%</span>

        <!-- 右側：Canvas プレビュー -->

                <div class="relative max-w-full overflow-auto flex justify-center items-center rounded-xl bg-black/50 p-2 border border-gray-800">

    </main>

    <!-- 一括生成結果モーダル -->
    <div id="batchModal" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-gray-900 border border-gray-700 rounded-2xl max-w-5xl w-full max-h-[90vh] flex flex-col overflow-hidden shadow-2xl">
            <div class="px-6 py-4 border-b border-gray-800 flex flex-wrap items-center justify-between gap-3 bg-gray-950">
                <div>
                    <h3 class="text-lg font-extrabold text-white flex items-center gap-2">
                        <i class="fa-solid fa-images text-amber-400"></i> 全18色 一括生成完了！
                    </h3>
                    <p class="text-xs text-gray-400 mt-0.5">PNG18枚を連続で一括ダウンロードするか、各画像をタップして保存できます</p>
                </div>
                <div class="flex items-center gap-2">
                    <button id="downloadAllPngBtn" onclick="downloadAllAsPngs()" class="bg-spotify-green hover:bg-green-400 text-black font-bold text-xs sm:text-sm py-2 px-4 rounded-lg flex items-center gap-1.5 transition">

            </div>
            <div id="batchGrid" class="p-6 overflow-y-auto grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-4">

    <!-- カスタム通知トースト -->
    <div id="toastMessage" class="fixed bottom-5 right-5 z-50 hidden bg-gray-900 border border-green-500/50 text-white px-4 py-3 rounded-xl shadow-2xl text-sm font-semibold flex items-center gap-2">
        <i class="fa-solid fa-circle-info text-green-400"></i>
        <span id="toastText"></span>
    </div>

    <footer class="border-t border-gray-800 py-4 text-center text-xs text-gray-500">
        <p>Spotify API & HTML5 Canvas Ranking Generator</p>
    </footer>

    <script>
        // デモ用トラックデータ（人気度スコア付き）
        const DEMO_TRACKS = [
            { name: "Blinding Lights", artist: "The Weeknd", popularity: 96, albumArt: "https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=300&auto=format&fit=crop" },
            { name: "Stay", artist: "The Kid LAROI, Justin Bieber", popularity: 92, albumArt: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=300&auto=format&fit=crop" },
            { name: "As It Was", artist: "Harry Styles", popularity: 94, albumArt: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=300&auto=format&fit=crop" },
            { name: "Starboy", artist: "The Weeknd, Daft Punk", popularity: 95, albumArt: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=300&auto=format&fit=crop" },
            { name: "Heat Waves", artist: "Glass Animals", popularity: 91, albumArt: "https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=300&auto=format&fit=crop" }
        ];

        // 全18色：すべて金・銀と同じ高彩度（ビビッド）メタリック色調に統一
        const THEMES = [
            { id: 'dark',     name: 'メタル・オブシディアン', swatch: 'linear-gradient(135deg, #52525b, #18181b, #09090b)', stops: ['#09090b', '#27272a', '#52525b', '#18181b', '#050505'], accent: '#4ade80', border: 'rgba(161, 161, 170, 0.55)' },
            { id: 'slate',    name: 'メタル・スチール',       swatch: 'linear-gradient(135deg, #94a3b8, #334155, #0f172a)', stops: ['#090d16', '#1e293b', '#64748b', '#1e293b', '#060911'], accent: '#7dd3fc', border: 'rgba(148, 163, 184, 0.55)' },
            { id: 'midnight', name: 'メタル・ミッドナイト',   swatch: 'linear-gradient(135deg, #6366f1, #1e1b4b, #090d16)', stops: ['#07091f', '#1e1b4b', '#4f46e5', '#17143b', '#050614'], accent: '#a5b4fc', border: 'rgba(129, 140, 248, 0.6)' },
            { id: 'purple',   name: 'メタル・パープル',       swatch: 'linear-gradient(135deg, #c084fc, #6b21a8, #2e1065)', stops: ['#170533', '#581c87', '#a855f7', '#4c1d95', '#100324'], accent: '#e9d5ff', border: 'rgba(192, 132, 252, 0.65)' },
            { id: 'indigo',   name: 'メタル・インディゴ',     swatch: 'linear-gradient(135deg, #818cf8, #3730a3, #1e1b4b)', stops: ['#0e0c2e', '#312e81', '#6366f1', '#272469', '#09071f'], accent: '#c7d2fe', border: 'rgba(129, 140, 248, 0.65)' },
            { id: 'blue',     name: 'メタル・コバルトブルー', swatch: 'linear-gradient(135deg, #60a5fa, #1d4ed8, #172554)', stops: ['#081433', '#1e40af', '#3b82f6', '#17338a', '#050c21'], accent: '#bae6fd', border: 'rgba(96, 165, 250, 0.65)' },
            { id: 'cyan',     name: 'メタル・シアン',         swatch: 'linear-gradient(135deg, #22d3ee, #0e7490, #083344)', stops: ['#041b24', '#0e7490', '#06b6d4', '#0b566b', '#021017'], accent: '#a5f3fc', border: 'rgba(34, 211, 238, 0.65)' },
            { id: 'teal',     name: 'メタル・ティール',       swatch: 'linear-gradient(135deg, #2dd4bf, #0f766e, #042f2e)', stops: ['#021a19', '#0f766e', '#14b8a6', '#0b5751', '#01100f'], accent: '#99f6e4', border: 'rgba(45, 212, 191, 0.65)' },
            { id: 'emerald',  name: 'メタル・エメラルド',     swatch: 'linear-gradient(135deg, #34d399, #047857, #022c22)', stops: ['#021c15', '#047857', '#10b981', '#035941', '#01120d'], accent: '#a7f3d0', border: 'rgba(52, 211, 153, 0.65)' },
            { id: 'lime',     name: 'メタル・ライム',         swatch: 'linear-gradient(135deg, #a3e635, #4d7c0f, #1a2e05)', stops: ['#0f1c03', '#4d7c0f', '#84cc16', '#3b610a', '#091202'], accent: '#d9f99d', border: 'rgba(163, 230, 53, 0.65)' },
            { id: 'amber',    name: 'メタル・アンバー',       swatch: 'linear-gradient(135deg, #fbbf24, #b45309, #451a03)', stops: ['#240d02', '#b45309', '#f59e0b', '#8c3f06', '#170801'], accent: '#fde68a', border: 'rgba(251, 191, 36, 0.65)' },
            { id: 'orange',   name: 'メタル・オレンジ',       swatch: 'linear-gradient(135deg, #fb923c, #c2410c, #431407)', stops: ['#240a03', '#c2410c', '#f97316', '#963108', '#170602'], accent: '#fed7aa', border: 'rgba(251, 146, 60, 0.65)' },
            { id: 'red',      name: 'メタル・クリムゾン',     swatch: 'linear-gradient(135deg, #f87171, #b91c1c, #450a0a)', stops: ['#240404', '#b91c1c', '#ef4444', '#8f1414', '#170202'], accent: '#fecaca', border: 'rgba(248, 113, 113, 0.65)' },
            { id: 'rose',     name: 'メタル・ローズ',         swatch: 'linear-gradient(135deg, #fb7185, #be123c, #4c0519)', stops: ['#26020c', '#be123c', '#f43f5e', '#940c2e', '#170107'], accent: '#fecdd3', border: 'rgba(251, 113, 133, 0.65)' },
            { id: 'pink',     name: 'メタル・マゼンタピンク', swatch: 'linear-gradient(135deg, #f472b6, #be185d, #500724)', stops: ['#290312', '#be185d', '#ec4899', '#941147', '#1a020b'], accent: '#fbcfe8', border: 'rgba(244, 114, 182, 0.65)' },
            { id: 'fuchsia',  name: 'メタル・フューシャ',     swatch: 'linear-gradient(135deg, #e879f9, #a21caf, #4a044e)', stops: ['#260229', '#a21caf', '#d946ef', '#7e1487', '#17011a'], accent: '#f5d0fe', border: 'rgba(232, 121, 249, 0.65)' },
            // 金色・銀色
            { id: 'gold',     name: 'ゴールド (Gold)',        swatch: 'linear-gradient(135deg, #fef08a, #eab308, #713f12)', stops: ['#241503', '#9a6708', '#facc15', '#784e05', '#170d02'], accent: '#fef08a', border: 'rgba(253, 224, 71, 0.75)' },
            { id: 'silver',   name: 'シルバー (Silver)',      swatch: 'linear-gradient(135deg, #ffffff, #cbd5e1, #334155)', stops: ['#0f172a', '#64748b', '#e2e8f0', '#475569', '#090d16'], accent: '#ffffff', border: 'rgba(241, 245, 249, 0.75)' }
        ];

        let state = {
            accessToken: null,
            limit: 10,
            timeRange: 'long_term',
            theme: 'dark',
            tracks: []
        };

        const imageCache = new Map();
        let generatedBatchImages = [];

        function showToast(msg) {
            const toast = document.getElementById('toastMessage');
            const text = document.getElementById('toastText');
            text.innerText = msg;
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 4000);
        }

        window.onload = async function() {
            renderThemePalette();
            setupRedirectUriInfo();
            
            const savedClientId = localStorage.getItem('spotify_client_id');
            if (savedClientId) {
                document.getElementById('clientIdInput').value = savedClientId;
            }

            await checkAuthCallback();
            if (!state.accessToken) {
                loadDemoData();
            }
        };

        function renderThemePalette() {
            const container = document.getElementById('themePalette');
            container.innerHTML = '';

            THEMES.forEach(t => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.title = t.name;
                btn.dataset.themeId = t.id;
                btn.onclick = () => setTheme(t.id);
                btn.style.background = t.swatch;
                
                const isSelected = state.theme === t.id;
                btn.className = `w-full aspect-square rounded-lg transition transform hover:scale-110 focus:outline-none relative flex items-center justify-center ${
                    isSelected ? 'ring-2 ring-white scale-105 shadow-lg' : 'ring-1 ring-white/15 opacity-85 hover:opacity-100'
                }`;

                if (t.id === 'gold' || t.id === 'silver') {
                    const badge = document.createElement('span');
                    badge.className = 'text-[10px] font-extrabold text-black/80 bg-white/70 px-1 rounded shadow-sm';
                    badge.innerText = t.id === 'gold' ? '金' : '銀';
                    btn.appendChild(badge);
                }

                container.appendChild(btn);
            });
        }

        function setupRedirectUriInfo() {
            let redirectUri = window.location.origin + window.location.pathname;
            if (window.location.hostname === 'localhost') {
                redirectUri = redirectUri.replace('localhost', '127.0.0.1');
            }
            redirectUri = redirectUri.replace(/\/index\.html$/, '/');
            redirectUri = redirectUri.split('?')[0].split('#')[0];
            if (!redirectUri.endsWith('/')) {
                redirectUri += '/';
            }

            const uriInput = document.getElementById('currentRedirectUri');
            if (uriInput) uriInput.value = redirectUri;
        }

        function copyRedirectUri() {
            const uriInput = document.getElementById('currentRedirectUri');
            if (!uriInput) return;
            
            uriInput.select();
            uriInput.setSelectionRange(0, 99999);
            document.execCommand('copy');

            const btn = document.getElementById('copyUriBtn');
            if (btn) {
                btn.innerHTML = '<i class="fa-solid fa-check"></i> コピー完了!';
                setTimeout(() => { btn.innerHTML = '<i class="fa-regular fa-copy"></i> コピー'; }, 2000);
            }
        }

        // PKCE用ランダム文字列生成
        function generateRandomString(length) {
            const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            const values = crypto.getRandomValues(new Uint8Array(length));
            return values.reduce((acc, x) => acc + possible[x % possible.length], '');
        }

        // SHA-256ハッシュ生成
        async function sha256(plain) {
            const encoder = new TextEncoder();
            const data = encoder.encode(plain);
            return window.crypto.subtle.digest('SHA-256', data);
        }

        // Base64URLエンコード
        function base64encode(input) {
            return btoa(String.fromCharCode(...new Uint8Array(input)))
                .replace(/=/g, '')
                .replace(/\+/g, '-')
                .replace(/\//g, '_');
        }

        // Authorization Code with PKCE (response_type=code) によるログイン
        async function handleSpotifyLogin() {
            let rawClientId = document.getElementById('clientIdInput').value || '';

            let clientId = rawClientId
                .replace(/[Ａ-Ｚａ-ｚ０-９]/g, function(s) {
                    return String.fromCharCode(s.charCodeAt(0) - 0xfee0);
                })
                .replace(/[^a-zA-Z0-9]/g, '');

            if (!clientId || clientId.length !== 32) {
                showToast("有効な Spotify Client ID (32桁の半角英数字) を入力してください。");
                return;
            }

            document.getElementById('clientIdInput').value = clientId;
            localStorage.setItem('spotify_client_id', clientId);

            // PKCE Code Verifier & Challenge 生成
            const codeVerifier = generateRandomString(64);
            localStorage.setItem('spotify_code_verifier', codeVerifier);

            const hashed = await sha256(codeVerifier);
            const codeChallenge = base64encode(hashed);

            let redirectUri = document.getElementById('currentRedirectUri').value.trim();
            const scope = 'user-top-read';

            const params = new URLSearchParams({
                response_type: 'code',
                client_id: clientId,
                scope: scope,
                code_challenge_method: 'S256',
                code_challenge: codeChallenge,
                redirect_uri: redirectUri,
                show_dialog: 'true'
            });

            window.location.href = `https://accounts.spotify.com/authorize?${params.toString()}`;
        }

        async function checkAuthCallback() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');

            if (code) {
                const codeVerifier = localStorage.getItem('spotify_code_verifier');
                const clientId = localStorage.getItem('spotify_client_id') || document.getElementById('clientIdInput').value.trim();
                const redirectUri = document.getElementById('currentRedirectUri').value.trim();

                if (codeVerifier && clientId) {
                    try {
                        const response = await fetch('https://accounts.spotify.com/api/token', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/x-www-form-urlencoded',
                            },
                            body: new URLSearchParams({
                                client_id: clientId,
                                grant_type: 'authorization_code',
                                code: code,
                                redirect_uri: redirectUri,
                                code_verifier: codeVerifier
                            })
                        });

                        const data = await response.json();
                        if (data.access_token) {
                            state.accessToken = data.access_token;
                            localStorage.removeItem('spotify_code_verifier');
                            document.getElementById('userStatus').innerHTML = '<span class="text-green-400 font-bold"><i class="fa-solid fa-circle-check"></i> Spotify 連携済み</span>';
                            window.history.replaceState({}, document.title, window.location.pathname);
                            await fetchTopTracks();
                        } else {
                            console.error('トークン取得エラー:', data);
                            showToast("認証トークンの取得に失敗しました。再度ログインしてください。");
                        }
                    } catch (err) {
                        console.error('認証エラー:', err);
                        showToast("認証通信中にエラーが発生しました。");
                    }
                }
            }
        }

        async function fetchTopTracks() {
            if (!state.accessToken) return;

            try {
                const response = await fetch(`https://api.spotify.com/v1/me/top/tracks?time_range=${state.timeRange}&limit=50`, {
                    headers: { 'Authorization': `Bearer ${state.accessToken}` }
                });

                if (!response.ok) {
                    throw new Error('API呼び出しに失敗しました');
                }

                const data = await response.json();
                state.tracks = data.items.map(item => ({
                    name: item.name,
                    artist: item.artists.map(a => a.name).join(', '),
                    popularity: item.popularity || 50,
                    albumArt: item.album.images[0]?.url || 'https://placehold.co/300x300/1f2937/9ca3af?text=No+Image'
                }));

                renderCanvas();
            } catch (err) {
                console.error(err);
                showToast("Spotifyデータの取得に失敗しました。デモデータを表示します。");
                loadDemoData();
            }
        }

        function loadDemoData() {
            let list = [];
            for (let i = 0; i < 50; i++) {
                const base = DEMO_TRACKS[i % DEMO_TRACKS.length];
                list.push({
                    name: `${base.name} ${i >= 10 ? '#' + (i + 1) : ''}`,
                    artist: base.artist,
                    popularity: Math.max(45, base.popularity - Math.floor(i * 0.7)),
                    albumArt: base.albumArt
                });
            }
            state.tracks = list;
            renderCanvas();
        }

        // Popularityスコア(0〜100)からSpotify総再生数(グローバル推定値)をフォーマット
        function formatTotalStreams(popularity) {
            const pop = Math.max(1, Math.min(100, popularity || 50));
            // 指数スケールでリアルな再生数表記へ変換
            const streams = Math.round(Math.pow(10, 5.2 + (pop / 100) * 4.15));
            if (streams >= 1000000000) {
                return (streams / 1000000000).toFixed(2) + 'B plays';
            } else if (streams >= 1000000) {
                return (streams / 1000000).toFixed(1) + 'M plays';
            } else {
                return Math.round(streams / 1000) + 'K plays';
            }
        }

        function setTheme(themeId) {
            state.theme = themeId;
            const themeObj = THEMES.find(t => t.id === themeId);
            if (themeObj) {
                document.getElementById('currentThemeLabel').innerText = themeObj.name;
            }
            renderThemePalette();
            renderCanvas();
        }

        function setLimit(newLimit) {
            state.limit = newLimit;
            [5, 10, 15, 50].forEach(num => {
                const btn = document.getElementById(`limit${num}Btn`);
                if (!btn) return;
                if (num === newLimit) {
                    btn.className = 'py-2 rounded-lg text-xs sm:text-sm font-semibold bg-green-500/20 text-green-400 border border-green-500/50 transition';
                } else {
                    btn.className = 'py-2 rounded-lg text-xs sm:text-sm font-semibold bg-gray-800 text-gray-400 border border-transparent hover:border-gray-700 transition';
                }
            });
            renderCanvas();
        }

        async function handleTimeRangeChange() {
            state.timeRange = document.getElementById('timeRangeSelect').value;
            if (state.accessToken) {
                await fetchTopTracks();
            } else {
                renderCanvas();
            }
        }

        async function drawRankingToCanvas(targetCanvas, themeId) {
            const ctx = targetCanvas.getContext('2d');
            const themeObj = THEMES.find(t => t.id === themeId) || THEMES[0];

            if (state.limit === 5) {
                targetCanvas.width = 800;
                targetCanvas.height = 960;
            } else if (state.limit === 10) {
                targetCanvas.width = 800;
                targetCanvas.height = 1200;
            } else if (state.limit === 15) {
                targetCanvas.width = 850;
                targetCanvas.height = 1480;
            } else {
                targetCanvas.width = 1200;
                targetCanvas.height = 1600;
            }

            drawBackground(ctx, targetCanvas.width, targetCanvas.height, themeObj);
            drawHeader(ctx, targetCanvas.width, themeObj);

            const displayTracks = state.tracks.slice(0, state.limit);
            
            if (state.limit === 5) {
                await drawTop5Layout(ctx, displayTracks, targetCanvas.width, themeObj);
            } else if (state.limit === 10) {
                await drawTop10Layout(ctx, displayTracks, targetCanvas.width, themeObj);
            } else if (state.limit === 15) {
                await drawTop15Layout(ctx, displayTracks, targetCanvas.width, themeObj);
            } else {
                await drawTop50Layout(ctx, displayTracks, targetCanvas.width, themeObj);
            }

            drawFooter(ctx, targetCanvas.width, targetCanvas.height, themeObj);
        }

        async function renderCanvas() {
            const canvas = document.getElementById('rankingCanvas');
            await drawRankingToCanvas(canvas, state.theme);
            document.getElementById('canvasDimensions').innerText = `${canvas.width} x ${canvas.height} px`;
        }

        function drawBackground(ctx, width, height, themeObj) {
            // 全18色にビビッド・メタリックの5段階グラデーションを適用
            let grad = ctx.createLinearGradient(0, 0, width, height);
            const stops = themeObj.stops;
            grad.addColorStop(0.0, stops[0]);
            grad.addColorStop(0.25, stops[1]);
            grad.addColorStop(0.5, stops[2]);
            grad.addColorStop(0.75, stops[3]);
            grad.addColorStop(1.0, stops[4]);

            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            // 文字の視認性を保つための適度なダークベール
            ctx.fillStyle = 'rgba(0, 0, 0, 0.36)';
            ctx.fillRect(0, 0, width, height);

            // 全色共通のメタリック外枠フレーム
            ctx.strokeStyle = themeObj.border;
            ctx.lineWidth = 6;
            ctx.strokeRect(18, 18, width - 36, height - 36);
        }

        function drawHeader(ctx, width, themeObj) {
            ctx.textAlign = 'left';
            
            ctx.fillStyle = themeObj.accent;
            ctx.beginPath();
            ctx.arc(60, 70, 18, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#FFFFFF';
            ctx.font = 'bold 36px "Plus Jakarta Sans", sans-serif';
            ctx.fillText('MY TOP TRACKS', 95, 82);

            const rangeText = state.timeRange === 'long_term' ? 'Past 1 Year / All Time' : 
                             state.timeRange === 'medium_term' ? 'Past 6 Months' : 'Past 4 Weeks';
            
            ctx.fillStyle = '#E5E7EB';
            ctx.font = '600 18px "Plus Jakarta Sans", sans-serif';
            ctx.fillText(`RANKING TOP ${state.limit} • ${rangeText}`, 95, 110);
        }

        async function drawTop5Layout(ctx, tracks, width, themeObj) {
            const startY = 155;
            const rowHeight = 148;

            for (let i = 0; i < tracks.length; i++) {
                const track = tracks[i];
                const y = startY + (i * rowHeight);

                ctx.fillStyle = 'rgba(0, 0, 0, 0.48)';
                ctx.beginPath();
                ctx.roundRect(50, y, width - 100, 128, 16);
                ctx.fill();

                ctx.strokeStyle = themeObj.border;
                ctx.lineWidth = 1.5;
                ctx.stroke();

                ctx.fillStyle = i === 0 ? themeObj.accent : '#F3F4F6';
                ctx.font = 'extrabold 38px "Plus Jakarta Sans", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(`#${i + 1}`, 98, y + 78);

                try {
                    const img = await loadImage(track.albumArt);
                    ctx.save();
                    ctx.beginPath();
                    ctx.roundRect(145, y + 16, 96, 96, 12);
                    ctx.clip();
                    ctx.drawImage(img, 145, y + 16, 96, 96);
                    ctx.restore();
                } catch (e) {
                    ctx.fillStyle = '#374151';
                    ctx.fillRect(145, y + 16, 96, 96);
                }

                // 総再生回数（右側表示）
                const playsText = formatTotalStreams(track.popularity);
                ctx.textAlign = 'right';
                ctx.fillStyle = themeObj.accent;
                ctx.font = 'bold 17px "Plus Jakarta Sans", sans-serif';
                ctx.fillText(`▶ ${playsText}`, width - 75, y + 70);

                ctx.textAlign = 'left';
                ctx.fillStyle = '#FFFFFF';
                ctx.font = 'bold 25px "Plus Jakarta Sans", sans-serif';
                ctx.fillText(truncateText(ctx, track.name, width - 470), 265, y + 58);

                ctx.fillStyle = '#E5E7EB';
                ctx.font = '500 18px "Plus Jakarta Sans", sans-serif';
                ctx.fillText(truncateText(ctx, track.artist, width - 470), 265, y + 92);
            }
        }

        async function drawTop10Layout(ctx, tracks, width, themeObj) {
            const startY = 150;
            const rowHeight = 95;

            for (let i = 0; i < tracks.length; i++) {
                const track = tracks[i];
                const y = startY + (i * rowHeight);

                ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
                ctx.beginPath();
                ctx.roundRect(50, y, width - 100, 80, 12);
                ctx.fill();

                ctx.fillStyle = i < 3 ? themeObj.accent : '#D1D5DB';
                ctx.font = 'extrabold 28px "Plus Jakarta Sans", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(`#${i + 1}`, 90, y + 50);

                try {
                    const img = await loadImage(track.albumArt);
                    ctx.save();
                    ctx.beginPath();
                    ctx.roundRect(130, y + 10, 60, 60, 8);
                    ctx.clip();
                    ctx.drawImage(img, 130, y + 10, 60, 60);
                    ctx.restore();
                } catch (e) {
                    ctx.fillStyle = '#374151';
                    ctx.fillRect(130, y + 10, 60, 60);
                }

                // 総再生回数（右側表示）
                const playsText = formatTotalStreams(track.popularity);
                ctx.textAlign = 'right';
                ctx.fillStyle = themeObj.accent;
                ctx.font = 'bold 14px "Plus Jakarta Sans", sans-serif';
                ctx.fillText(`▶ ${playsText}`, width - 70, y + 46);

                ctx.textAlign = 'left';
                ctx.fillStyle = '#FFFFFF';
                ctx.font = 'bold 20px "Plus Jakarta Sans", sans-serif';
                ctx.fillText(truncateText(ctx, track.name, width - 430), 210, y + 40);

                ctx.fillStyle = '#D1D5DB';
                ctx.font = '500 15px "Plus Jakarta Sans", sans-serif';
                ctx.fillText(truncateText(ctx, track.artist, width - 430), 210, y + 63);
            }
        }

        async function drawTop15Layout(ctx, tracks, width, themeObj) {
            const startY = 148;
            const rowHeight = 82;

            for (let i = 0; i < tracks.length; i++) {
                const track = tracks[i];
                const y = startY + (i * rowHeight);

                ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
                ctx.beginPath();
                ctx.roundRect(50, y, width - 100, 70, 10);
                ctx.fill();

                ctx.fillStyle = i < 3 ? themeObj.accent : '#D1D5DB';
                ctx.font = 'extrabold 24px "Plus Jakarta Sans", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(`#${i + 1}`, 90, y + 44);

                try {
                    const img = await loadImage(track.albumArt);
                    ctx.save();
                    ctx.beginPath();
                    ctx.roundRect(130, y + 9, 52, 52, 7);
                    ctx.clip();
                    ctx.drawImage(img, 130, y + 9, 52, 52);
                    ctx.restore();
                } catch (e) {
                    ctx.fillStyle = '#374151';
                    ctx.fillRect(130, y + 9, 52, 52);
                }

                // 総再生回数（右側表示）
                const playsText = formatTotalStreams(track.popularity);
                ctx.textAlign = 'right';
                ctx.fillStyle = themeObj.accent;
                ctx.font = 'bold 13px "Plus Jakarta Sans", sans-serif';
                ctx.fillText(`▶ ${playsText}`, width - 70, y + 40);

                ctx.textAlign = 'left';
                ctx.fillStyle = '#FFFFFF';
                ctx.font = 'bold 18px "Plus Jakarta Sans", sans-serif';
                ctx.fillText(truncateText(ctx, track.name, width - 420), 200, y + 34);

                ctx.fillStyle = '#D1D5DB';
                ctx.font = '500 14px "Plus Jakarta Sans", sans-serif';
                ctx.fillText(truncateText(ctx, track.artist, width - 420), 200, y + 55);
            }
        }

        async function drawTop50Layout(ctx, tracks, width, themeObj) {
            const startY = 150;
            const cols = 2;
            const colWidth = (width - 130) / cols;
            const rowHeight = 52;

            for (let i = 0; i < tracks.length; i++) {
                const track = tracks[i];
                const col = i % cols;
                const row = Math.floor(i / cols);

                const x = 50 + (col * (colWidth + 30));
                const y = startY + (row * rowHeight);

                ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
                ctx.beginPath();
                ctx.roundRect(x - 4, y + 2, colWidth + 8, 46, 6);
                ctx.fill();

                ctx.fillStyle = i < 3 ? themeObj.accent : '#D1D5DB';
                ctx.font = 'bold 16px "Plus Jakarta Sans", sans-serif';
                ctx.textAlign = 'right';
                ctx.fillText(`${i + 1}`, x + 25, y + 32);

                try {
                    const img = await loadImage(track.albumArt);
                    ctx.save();
                    ctx.beginPath();
                    ctx.roundRect(x + 35, y + 8, 36, 36, 6);
                    ctx.clip();
                    ctx.drawImage(img, x + 35, y + 8, 36, 36);
                    ctx.restore();
                } catch (e) {
                    ctx.fillStyle = '#374151';
                    ctx.fillRect(x + 35, y + 8, 36, 36);
                }

                // 総再生回数（各列の右端に表示）
                const playsText = formatTotalStreams(track.popularity);
                ctx.textAlign = 'right';
                ctx.fillStyle = themeObj.accent;
                ctx.font = 'bold 11px "Plus Jakarta Sans", sans-serif';
                ctx.fillText(`▶ ${playsText}`, x + colWidth - 6, y + 29);

                ctx.textAlign = 'left';
                ctx.fillStyle = '#FFFFFF';
                ctx.font = 'bold 14px "Plus Jakarta Sans", sans-serif';
                ctx.fillText(truncateText(ctx, track.name, colWidth - 185), x + 80, y + 26);

                ctx.fillStyle = '#E5E7EB';
                ctx.font = '500 12px "Plus Jakarta Sans", sans-serif';
                ctx.fillText(truncateText(ctx, track.artist, colWidth - 185), x + 80, y + 41);
            }
        }

        function drawFooter(ctx, width, height, themeObj) {
            ctx.textAlign = 'center';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.font = '600 14px "Plus Jakarta Sans", sans-serif';
            ctx.fillText('POWERED BY SPOTIFY API • CANVAS GENERATOR', width / 2, height - 28);
        }

        function loadImage(src) {
            if (imageCache.has(src)) {
                return Promise.resolve(imageCache.get(src));
            }
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.crossOrigin = 'Anonymous';
                img.onload = () => {
                    imageCache.set(src, img);
                    resolve(img);
                };
                img.onerror = (e) => reject(e);
                img.src = src;
            });
        }

        function truncateText(ctx, text, maxWidth) {
            if (ctx.measureText(text).width <= maxWidth) return text;
            let truncated = text;
            while (ctx.measureText(truncated + '...').width > maxWidth && truncated.length > 0) {
                truncated = truncated.slice(0, -1);
            }
            return truncated + '...';
        }

        function downloadCanvas() {
            const canvas = document.getElementById('rankingCanvas');
            const link = document.createElement('a');
            link.download = `spotify-top-${state.limit}-${state.theme}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        async function generateAll18Themes() {
            const btn = document.getElementById('batchGenerateBtn');
            const progContainer = document.getElementById('batchProgressContainer');
            const progText = document.getElementById('batchProgressText');
            const progPercent = document.getElementById('batchProgressPercent');
            const progBar = document.getElementById('batchProgressBar');

            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');
            progContainer.classList.remove('hidden');
            generatedBatchImages = [];

            const offscreenCanvas = document.createElement('canvas');

            try {
                for (let i = 0; i < THEMES.length; i++) {
                    const theme = THEMES[i];
                    const current = i + 1;
                    const pct = Math.round((current / THEMES.length) * 100);

                    progText.innerText = `生成中: ${theme.name} (${current} / ${THEMES.length})`;
                    progPercent.innerText = `${pct}%`;
                    progBar.style.width = `${pct}%`;

                    await new Promise(r => setTimeout(r, 30));

                    await drawRankingToCanvas(offscreenCanvas, theme.id);
                    const dataUrl = offscreenCanvas.toDataURL('image/png');

                    generatedBatchImages.push({
                        id: theme.id,
                        name: theme.name,
                        filename: `spotify-top${state.limit}-${String(current).padStart(2, '0')}-${theme.id}.png`,
                        dataUrl: dataUrl
                    });
                }

                openBatchModal();
            } catch (err) {
                console.error('一括生成エラー:', err);
                showToast('画像の一括生成中にエラーが発生しました。');
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
                setTimeout(() => {
                    progContainer.classList.add('hidden');
                }, 1000);
            }
        }

        function openBatchModal() {
            const modal = document.getElementById('batchModal');
            const grid = document.getElementById('batchGrid');
            grid.innerHTML = '';

            generatedBatchImages.forEach(item => {
                const card = document.createElement('div');
                card.className = 'bg-gray-950 border border-gray-800 rounded-xl p-2 flex flex-col items-center gap-2';

                const img = document.createElement('img');
                img.src = item.dataUrl;
                img.alt = item.name;
                img.className = 'w-full h-auto rounded-lg shadow border border-gray-800';

                const label = document.createElement('span');
                label.className = 'text-xs font-bold text-gray-200 text-center truncate w-full';
                label.innerText = item.name;

                const dlBtn = document.createElement('button');
                dlBtn.className = 'w-full bg-gray-800 hover:bg-gray-700 text-white text-xs font-semibold py-1.5 px-2 rounded-lg flex items-center justify-center gap-1 transition';
                dlBtn.innerHTML = '<i class="fa-solid fa-download"></i> 保存';
                dlBtn.onclick = () => {
                    const a = document.createElement('a');
                    a.href = item.dataUrl;
                    a.download = item.filename;
                    a.click();
                };

                card.appendChild(img);
                card.appendChild(label);
                card.appendChild(dlBtn);
                grid.appendChild(card);
            });

            modal.classList.remove('hidden');
        }

        function closeBatchModal() {
            document.getElementById('batchModal').classList.add('hidden');
        }

        // ZIPではなくPNGファイルを連続で一括ダウンロード
        async function downloadAllAsPngs() {
            if (!generatedBatchImages.length) return;
            const dlBtn = document.getElementById('downloadAllPngBtn');
            const originalHtml = dlBtn.innerHTML;
            dlBtn.disabled = true;

            try {
                for (let i = 0; i < generatedBatchImages.length; i++) {
                    const item = generatedBatchImages[i];
                    dlBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> PNG保存中 (${i + 1}/${generatedBatchImages.length})...`;
                    
                    const link = document.createElement('a');
                    link.href = item.dataUrl;
                    link.download = item.filename;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);

                    // ブラウザの連続ダウンロード制限を回避するため少し待機
                    await new Promise(r => setTimeout(r, 350));
                }

                showToast('全18枚のPNGファイルのダウンロードが完了しました！');
            } catch (e) {
                console.error(e);
                showToast('一括保存中にエラーが発生しました。個別ボタンから保存してください。');
            } finally {
                dlBtn.disabled = false;
                dlBtn.innerHTML = originalHtml;
            }
        }
    </script>
</body>
</html>
